<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a68c8"><title>Seapoint</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./sheet-modes.css"><link rel="stylesheet" href="./auth.css"><link rel="stylesheet" href="./legend-position.css"><link rel="stylesheet" href="./shared-records.css"><link rel="stylesheet" href="./auth-extra.css"></head>
<body><main class="app-shell"><header class="topbar"><img class="brand-logo" src="./seapoint-logo.png" alt="Seapoint logo"><div><strong>Seapoint</strong><span id="brandSubtitle"></span></div><div class="auth-actions" id="authActions"><button id="loginOpen" type="button">로그인</button><button id="signupOpen" type="button">회원가입</button></div></header><section class="map-area" aria-label="Seapoint map"><div id="map"></div><div class="map-title"><small id="mapSource"></small><b id="mapHeading"></b></div><div class="legend"><span id="legendLow"></span><i></i><span id="legendHigh"></span></div></section><section class="bottom-sheet" id="sheet" aria-live="polite"><button class="sheet-grabber" id="sheetGrabber" type="button" aria-label="Move result panel"><span class="drag-handle"></span></button><div class="eyebrow" id="selectedLabel"></div><div class="area-heading"><h1 id="areaName"></h1><span id="observationLabel"></span></div><div class="risk-card"><div class="risk-ring" id="riskRing"><span id="riskScore">--</span><small>%</small></div><div><small id="densityLabel"></small><b id="riskLabel"></b><p id="riskSummary"></p></div></div><section class="data-section"><div class="section-title"><h2 id="csvTitle"></h2><span id="timeRange"></span></div><div class="metrics" id="metrics"></div></section><section class="data-section result-section"><div class="section-title"><h2 id="analysisTitle"></h2><span id="analysisBasis"></span></div><p id="analysisText"></p></section><section class="cleaning-section"><div class="section-title"><h2 id="cleaningTitle"></h2><span id="recordStatus"></span></div><button class="clean-button" id="cleanButton" type="button"></button><ul class="cleaning-list" id="cleaningList"></ul></section><p class="data-note" id="dataNote"></p></section></main>
<section class="auth-page" id="authPage" aria-hidden="true"><header><button class="back-button" id="authBack" type="button" aria-label="뒤로 가기">‹</button><b id="authTitle">로그인</b></header><div class="auth-card" id="loginScreen"><p>SeaPoint 계정으로<br>청소 기록을 관리하세요.</p><label>아이디<input id="loginId" autocomplete="username" placeholder="아이디 입력"></label><label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력"></label><p class="auth-message" id="authMessage" role="alert"></p><button class="primary-auth" id="loginSubmit" type="button">로그인</button><button class="text-auth" id="goSignup" type="button">계정이 없나요? 회원가입</button></div><div class="auth-card hidden" id="signupScreen"><p>간단하게 계정을 만들고<br>청소 활동을 기록하세요.</p><label>아이디<input id="signupId" autocomplete="username" placeholder="영문, 숫자 4~20자"></label><label>비밀번호<input id="signupPassword" type="password" autocomplete="new-password" placeholder="비밀번호 8자 이상"></label><button class="primary-auth" id="signupComplete" type="button">회원가입 완료</button><small>가입한 계정은 다른 기기에서도 사용할 수 있습니다.</small></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./app.js"></script><script src="./auth.js"></script></body></html>
