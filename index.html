<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Seapoint</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./sheet-modes.css"><link rel="stylesheet" href="./auth.css"><link rel="stylesheet" href="./legend-position.css"><link rel="stylesheet" href="./shared-records.css"><link rel="stylesheet" href="./auth-extra.css"></head>
<body><main class="app-shell"><header class="topbar"><img class="brand-logo" src="./seapoint-logo.png" alt="Seapoint"><div><strong>Seapoint</strong><span id="brandSubtitle"></span></div><div class="auth-actions" id="authActions"><button id="loginOpen" type="button">&#47196;&#44536;&#51064;</button><button id="signupOpen" type="button">&#54924;&#50896;&#44032;&#51077;</button></div></header><section class="map-area"><div id="map"></div><div class="map-title"><small id="mapSource"></small><b id="mapHeading"></b></div><div class="legend"><span id="legendLow"></span><i></i><span id="legendHigh"></span></div></section><section class="bottom-sheet" id="sheet"><button class="sheet-grabber" id="sheetGrabber" type="button"><span class="drag-handle"></span></button><div class="eyebrow" id="selectedLabel"></div><div class="area-heading"><h1 id="areaName"></h1><span id="observationLabel"></span></div><div class="risk-card"><div class="risk-ring" id="riskRing"><span id="riskScore">--</span><small>%</small></div><div><small id="densityLabel"></small><b id="riskLabel"></b><p id="riskSummary"></p></div></div><section class="data-section"><div class="section-title"><h2 id="csvTitle"></h2><span id="timeRange"></span></div><div class="metrics" id="metrics"></div></section><section class="data-section result-section"><div class="section-title"><h2 id="analysisTitle"></h2><span id="analysisBasis"></span></div><p id="analysisText"></p></section><section class="cleaning-section"><div class="section-title"><h2 id="cleaningTitle"></h2><span id="recordStatus"></span></div><button class="clean-button" id="cleanButton" type="button"></button><ul class="cleaning-list" id="cleaningList"></ul></section><p class="data-note" id="dataNote"></p></section></main>
<section class="auth-page" id="authPage" aria-hidden="true"><header><button class="back-button" id="authBack" type="button">&lsaquo;</button><b id="authTitle"></b></header><div class="auth-card" id="loginScreen"><p>SeaPoint account</p><label>Username<input id="loginId" autocomplete="username" placeholder="Username"></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password"></label><p class="auth-message" id="authMessage" role="alert"></p><button class="primary-auth" id="loginSubmit" type="button">Login</button><button class="text-auth" id="goSignup" type="button">Create an account</button></div><div class="auth-card hidden" id="signupScreen"><p>Create a SeaPoint account</p><label>Username<input id="signupId" autocomplete="username" placeholder="English letters and numbers, 4-20 characters"></label><label>Password<input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters"></label><p class="auth-message" id="signupMessage" role="alert"></p><button class="primary-auth" id="signupComplete" type="button">Create account</button></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./app.js"></script><script src="./auth.js"></script></body></html>
